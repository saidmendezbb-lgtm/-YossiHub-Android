name: YossiHub Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar keystore
        shell: bash
        run: |
          echo "${{ secrets.YOSSIHUB_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/yossihub-release.jks"

      - name: Compilar AAB firmado
        env:
          YOSSIHUB_KEYSTORE_PATH: ${{ runner.temp }}/yossihub-release.jks
          YOSSIHUB_KEYSTORE_PASSWORD: ${{ secrets.YOSSIHUB_KEYSTORE_PASSWORD }}
          YOSSIHUB_KEY_ALIAS: ${{ secrets.YOSSIHUB_KEY_ALIAS }}
          YOSSIHUB_KEY_PASSWORD: ${{ secrets.YOSSIHUB_KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: YossiHub-V456-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
