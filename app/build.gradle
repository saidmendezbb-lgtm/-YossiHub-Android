plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.yossihub.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yossihub.app'
        minSdk 24
        targetSdk 36
        versionCode 460
        versionName '4.60'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('YOSSIHUB_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('YOSSIHUB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('YOSSIHUB_KEY_ALIAS')
                keyPassword System.getenv('YOSSIHUB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('YOSSIHUB_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}
